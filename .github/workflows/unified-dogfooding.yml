name: Unified Dogfooding scans
on:
  schedule:
    - cron: '45 3 * * 1-5' # Run the workflow Mon-Fri at 03:45 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: sonar-m
    name: Build for Shadow Scan
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.0
      - name: Select Java 21
        run: mise use java@21
      - uses: SonarSource/ci-github-actions/build-gradle@v2
        with:
          run-shadow-scans: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer
          deploy-pull-request: false

  run_iris:
    needs: [ build ]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    concurrency:
      group: iris
      cancel-in-progress: false
      queue: single
    runs-on: sonar-xs
    name: Run IRIS
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Run IRIS Analysis
        uses: SonarSource/unified-dogfooding-actions/run-iris@v1
        with:
          primary_project_key: "org.sonarsource.jacoco:sonar-jacoco"
          primary_platform: "Next"
          shadow1_project_key: "org.sonarsource.jacoco:sonar-jacoco"
          shadow1_platform: "SQC-EU"
          shadow2_project_key: "org.sonarsource.jacoco:sonar-jacoco"
          shadow2_platform: "SQC-US"
