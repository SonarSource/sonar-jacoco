name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1-5"  # Run Mon-Fri at 01:30 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: sonar-xs
    name: Build
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access and tagging
    outputs:
      build-number: ${{ steps.build-step.outputs.BUILD_NUMBER }}
      deployed: ${{ steps.build-step.outputs.deployed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.0
      - name: Select Java 21
        run: mise use java@21
      - uses: SonarSource/ci-github-actions/build-gradle@v2
        id: build-step
        with:
          repox-url: https://repox-internal.dev.sonar.build
          deploy-pull-request: true
          artifactory-reader-role: private-reader
          artifactory-deployer-role: qa-deployer

  build-qa-windows:
    name: Build and QA Windows
    needs: build
    runs-on: warp-custom-windows-2022-m
    permissions:
      id-token: write  # Required for Vault OIDC authentication
      contents: write  # Required for repository access and tagging
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
      SQ_VERSION: 'LATEST_RELEASE[2026.1]'
    steps:
      - name: Config Git
        run: git config --global core.autocrlf input
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.0
      - name: Select Java 21
        run: mise use java@21
      - name: Get GitHub Token for QA Licenses
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;
            development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ORCHESTRATOR_ACCESS_TOKEN;
      - name: Configure production Orchestrator
        shell: bash
        env:
          ORCHESTRATOR_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ORCHESTRATOR_ACCESS_TOKEN }}
        run: |
          umask 077
          config_dir="$RUNNER_TEMP/orchestrator-production-config"
          mkdir -p "$config_dir"
          printf '%s\n' \
            'orchestrator.artifactory.url=https://repox-internal.sonar.build/artifactory' \
            "orchestrator.artifactory.accessToken=$ORCHESTRATOR_ACCESS_TOKEN" > "$config_dir/orchestrator.properties"
          config_path="$config_dir/orchestrator.properties"
          if [[ "$RUNNER_OS" == Windows ]]; then
            config_path="/$(cygpath -m "$config_path")"
          fi
          config_path="${config_path// /%20}"
          echo "ORCHESTRATOR_CONFIG_URL=file://$config_path" >> "$GITHUB_ENV"
      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@v2
        with:
          repox-url: https://repox-internal.dev.sonar.build
          artifactory-reader-role: private-reader
      - name: Orchestrator Cache
        uses: ./.github/actions/orchestrator-cache
        with:
          sq-version: ${{ env.SQ_VERSION }}
      - name: Build
        env:
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          ORCHESTRATOR_HOME: ${{ github.event_name == 'pull_request' && format('{0}/orchestrator-production', runner.temp) || env.ORCHESTRATOR_HOME }}
        shell: bash
        run: |
          ./gradlew "-Dorchestrator.configUrl=$ORCHESTRATOR_CONFIG_URL" "-Dorchestrator.home=$ORCHESTRATOR_HOME" "-Dsonar.runtimeVersion=$SQ_VERSION" -DbuildNumber=$BUILD_NUMBER --no-daemon --console plain --info --stacktrace build test -PintegrationTests=true

  qa:
    needs: [build]
    if: ${{ needs.build.outputs.deployed }}
    runs-on: sonar-m
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sq-version:
          # The plugin is compiled for Java 21, so it can only run on SonarQube versions that provision a Java 21 JRE to the scanner. 2026.1 is the oldest one, 2025.x provisions
          # Java 17.
          - "LATEST_RELEASE[2026.1]"
          - "LATEST_RELEASE"
          - "DEV"
        is_nightly:
          - ${{ github.event_name == 'schedule' }}
        exclude:
          # DEV is tested only in nightly to reduce Repox usage
          - sq-version: "DEV"
            is_nightly: false
    name: "QA Tests - SQ : ${{ matrix.sq-version }}"
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.0
      - name: Select Java 21
        run: mise use java@21
      - name: Get GitHub Token for QA Licenses
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/github/token/licenses-ro token | GITHUB_TOKEN;
            development/artifactory-edge-prod/token/{REPO_OWNER_NAME_DASH}-private-reader access_token | ORCHESTRATOR_ACCESS_TOKEN;
      - name: Configure production Orchestrator
        shell: bash
        env:
          ORCHESTRATOR_ACCESS_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ORCHESTRATOR_ACCESS_TOKEN }}
        run: |
          umask 077
          config_dir="$RUNNER_TEMP/orchestrator-production-config"
          mkdir -p "$config_dir"
          printf '%s\n' \
            'orchestrator.artifactory.url=https://repox-internal.sonar.build/artifactory' \
            "orchestrator.artifactory.accessToken=$ORCHESTRATOR_ACCESS_TOKEN" > "$config_dir/orchestrator.properties"
          config_path="$config_dir/orchestrator.properties"
          if [[ "$RUNNER_OS" == Windows ]]; then
            config_path="/$(cygpath -m "$config_path")"
          fi
          config_path="${config_path// /%20}"
          echo "ORCHESTRATOR_CONFIG_URL=file://$config_path" >> "$GITHUB_ENV"
      - name: Configure Gradle
        uses: SonarSource/ci-github-actions/config-gradle@v2
        with:
          repox-url: https://repox-internal.dev.sonar.build
          artifactory-reader-role: private-reader
      - name: Orchestrator Cache
        uses: ./.github/actions/orchestrator-cache
        with:
          sq-version: ${{ matrix.sq-version }}
      - name: Run QA Tests
        shell: bash
        env:
          SQ_VERSION: ${{ matrix.sq-version }}
          GITHUB_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          ORCHESTRATOR_HOME: ${{ github.event_name == 'pull_request' && format('{0}/orchestrator-production', runner.temp) || env.ORCHESTRATOR_HOME }}
        run: >-
          ./gradlew -DbuildNumber=$BUILD_NUMBER
          -PintegrationTests=true
          -Dsonar.runtimeVersion=$SQ_VERSION
          "-Dorchestrator.configUrl=$ORCHESTRATOR_CONFIG_URL" "-Dorchestrator.home=$ORCHESTRATOR_HOME"
          --console plain --no-daemon --info
          build test

  promote:
    needs: [build, build-qa-windows, qa]
    if: ${{ needs.build.outputs.deployed }}
    runs-on: sonar-xs
    name: Promote
    permissions:
      id-token: write
      contents: write
    env:
      BUILD_NUMBER: ${{ needs.build.outputs.build-number }}
    steps:
      - uses: SonarSource/ci-github-actions/promote@v2
        with:
          promote-pull-request: true

  notify-build-failure:
    needs: [build, build-qa-windows, qa, promote]
    if: >-
      always()
      && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/heads/branch-') || startsWith(github.ref, 'refs/heads/dogfood-'))
      && contains(needs.*.result, 'failure')
    runs-on: sonar-xs
    name: Notify build failure
    permissions:
      actions: read      # lets the action list this run's own jobs via the GitHub API
      id-token: write    # required for vault-action-wrapper in the shared slack-notify action
    steps:
      - name: Slack Notification
        uses: SonarSource/core-languages-tooling-public/common-actions/slack-notify@v1
        with:
          slack-channel: squad-corelang-notifs
          branch-patterns: ${{ format('{0},branch-*,dogfood-*', github.event.repository.default_branch) }}
          github-token: ${{ github.token }}
          branch: ${{ github.ref_name }}
